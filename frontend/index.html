<!DOCTYPE html>

    <!-- Fonts matching the photo: Merriweather for the elegant jungle quote & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              quote: ['"Merriweather"', 'Georgia', 'serif'],
              scoutTitle: ['"Cinzel"', 'serif']

          }
        }
      }

  <body class="bg-scout-dark text-slate-200 antialiased selection:bg-scout-yellow selection:text-scout-dark min-h-screen">
